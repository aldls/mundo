<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Test</title>
  <style>
    #messageBox {
      border: 1px solid #ccc;
      padding: 10px;
      width: 300px;
      height: 100px;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    #chatInput {
      margin-top: 10px;
      width: 300px;
    }
  </style>
</head>
<body>
  <div id="messageBox">Waiting for server message...</div>
  
  <!-- Input box for sending messages -->
  <input type="text" id="chatInput" placeholder="Type a message..." />
  <button id="sendMessageButton">Send</button>

  <script>
    // Create WebSocket connection to the server
    const socket = new WebSocket('ws://localhost:3000');

    // Handle connection open
    socket.onopen = () => {
      console.log('Connected to server');
    };

    // Handle incoming messages from the server
    socket.onmessage = (event) => {
      const message = event.data;
      console.log('Received message from server:', message);  // Log message in the console
      document.getElementById('messageBox').textContent = message; // Update the displayed message on this tab
    };

    // Handle connection close
    socket.onclose = () => {
      console.log('Disconnected from server');
    };

    // Send a message when the user clicks the send button
    document.getElementById('sendMessageButton').onclick = () => {
      const message = document.getElementById('chatInput').value;
      if (message) {
        socket.send(message);  // Send the message to the server
        document.getElementById('chatInput').value = '';  // Clear input box
      }
    };

    // Function to gracefully close the WebSocket server
    function closeServer() {
      console.log('Closing WebSocket server...');
      
      // Close the server, which will disconnect all clients
      server.close(() => {
        console.log('WebSocket server closed');
      });

      // Optionally, close each client connection (if needed)
      server.clients.forEach((client) => {
        client.close();
      });
    }

    // Catch SIGINT (Ctrl+C) to gracefully shut down the WebSocket server
    process.on('SIGINT', () => {
      console.log('Received SIGINT. Closing WebSocket server...');
      closeServer();
      process.exit(0);  // Terminate the process
    });


  </script>
</body>
</html>

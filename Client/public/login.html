<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Summoner's Rift</title>
  <link rel="stylesheet" href="/login.css">
  <button id="play-button">
    <img id="audio-icon" src="speaker.png" alt="Audio Icon" style="width: 30px; height: 30px;">
  </button>
  
  <audio id="bg-music" src="/loginBGM.mp3" loop></audio>
  
  <script>
    document.getElementById('play-button').addEventListener('click', function() {
      const audio = document.getElementById('bg-music');
      const icon = document.getElementById('audio-icon'); // Get the icon element
  
      if (audio.paused) {
        audio.play();
        icon.src = "muted.png"; // Change icon to muted.png when audio is playing
      } else {
        audio.pause();
        icon.src = "speaker.png"; // Change icon back to speaker.png when audio is paused
      }
    });
  </script>
  
  <style>
    #play-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px;
      background-color: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
  
    #play-button:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }
  
    #play-button img {
      width: 30px; /* Adjust the size of the icon */
      height: 30px;
    }
  </style>
  
  
</head>
<body>
  <!-- Left side container (Text Field) -->
  <div class="left-side">
    <h1>문도박사의<br>피구장에<br>오신 것을<br>환영합니다</h1>
    <p>구글 계정으로 로그인 하여 문도 피구를 시작해보세요!</p>
    <a href="/auth/google" class="gsi-material-button">
      <div class="gsi-material-button-content-wrapper">
        <div class="gsi-material-button-icon">
          <!-- Insert Google Icon here -->
          <img src="g-logo.png" alt="Google" style="width: 20px; height: 20px;">
        </div>
        <div class="gsi-material-button-contents">
          Sign in with Google
        </div>
      </div>
      <div class="gsi-material-button-state"></div>
    </a>
    <footer>© 2025 Dr.MUNDO DodgeBoneSaw. All rights reserved.</footer>
  </div>

  <!-- Right side container (Background Image) -->
  <div class="right-side"></div>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <style>
      body {
        margin: 0; 
        padding: 0;
        font-family: Tahoma, Geneva, sans-serif;
        overflow: auto; /* loading.png가 화면보다 크면 스크롤 가능 */
      }

      /* ===== 로비 화면 (loading.png 그대로 표시, ProgressBar는 화면 하단 고정) ===== */
      #lobbyContainer {
        display: none; /* 초기에 감춰두고, JS에서 제어 */
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* loading.png 원본 크기로 그대로 표시 */
      #lobbyImage {
        display: block;
        margin: 0 auto;
      }

      /* 바닥 고정 ProgressBar 영역 */
      .progress-bar-wrapper {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* 하나의 막대가 0~100% 로 채워짐 (색 동일) */
      #progressBar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%; /* JS에서 애니메이션 */
        background-color: #0FA697; 
        transition: width 1s ease; /* 1초 동안 부드럽게 */
      }
      /* 가운데 % 표시 */
      #progressText {
        position: absolute;
        width: 100%;
        line-height: 30px;
        text-align: center;
        color: #0FA697;
        top: 0;
        left: 0;
      }
      .progress-bar-container {
        position: relative;
        width: 420px;
        height: 5px;
        background-color: #0B1C26;
        border-radius: 5px;
        margin-bottom: 5px;
        border: 2px solid #695840; /* 테두리 색상과 두께 설정 */
      }

      .progress-trapezoid {
        position: absolute;
        top: -25px;       /* bar-container의 위로 튀어나옴 */
        left: 50%;
        transform: translateX(-50%);
        width: 64px;      /* 테두리 때문에 크기 약간 키움 */
        height: 24px;     /* 테두리 때문에 크기 약간 키움 */
        background: #695840;             /* 테두리 색상 */
        clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;

        /* 내부 사다리꼴 */
        position: relative;
      }
      .progress-trapezoid::after {
        content: '';                       /* 가상 요소 */
        position: absolute;
        top: 2px;                          /* 테두리 두께 */
        left: 2px;
        right: 2px;
        bottom: 2px;
        background: #05131D;               /* 내부 사다리꼴 색상 */
        clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        z-index: -1;                       /* 부모 위로 나오지 않도록 */
      }


      /* 상대방 들어왔을 때 보여줄 큰 profile.png */
      #profileSection {
        display: none;
      }

      /* ===== 카운트다운 화면 ===== */
      #countdownContainer {
        display: none; 
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.8);
        color: #fff;
        font-size: 3em;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* ===== 게임 화면 ===== */
      #gameContainer {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url('game_background.png');
        background-size: 100vw 100vh;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      .player {
        width: 100px;
        height: 100px;
        position: absolute;
        padding-top: 24px;
        box-sizing: border-box;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%); /* 중앙 정렬 */
      }
      .userid {
        position: absolute;
        width: 100px;
        height: 10px;
        background-color: transparent; /* HP 바의 배경 (깎인 부분) */
        /* border: 1px solid #333; 테두리 */
        top: -15px; /* 캐릭터 위에 위치하도록 조정 */
      }
      .hp-bar-container {
        position: absolute;
        width: 100px;
        height: 10px;
        background-color: black; /* HP 바의 배경 (깎인 부분) */
        border: 1px solid #333; /* 테두리 */
        top: -15px; /* 캐릭터 위에 위치하도록 조정 */
      }
      .hp-bar {
        height: 100%; /* HP 바 높이 */
      }
      .img {
        animation: rotate_image 1s linear infinite; /* 1초 동안 회전, 무한 반복 */
        transform-origin: 50% 50%; /* 중앙을 기준으로 회전 */
      }
      @keyframes rotate_image {
        from {
          transform: rotate(0deg); /* 시작 각도 */
        }
        to {
          transform: rotate(-360deg); /* 끝 각도 (시계 반대방향) */
        }
      }
      .victory-screen-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60%;
        height: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
}
      .victory-screen {
        width: 100%;
        height: auto;
        display: block;
      }
      .button-container {
        /* position: absolute;
        bottom: 20px;
        right: 20px; */
        display: flex;
        gap: 15px; /* 버튼 사이의 간격 조정 */
        margin-bottom: 10px;
      }

      .restart-button,
      .lobby-button {
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .restart-button {
        background-color: #4CAF50;
        color: white;
      }

      .lobby-button {
        background-color: #007BFF;
        color: white;
      }
       /* 채팅 관련련 */
       ::-webkit-scrollbar {
        width: 12px; /* 스크롤바 너비 */
      }

      ::-webkit-scrollbar-thumb {
        background-color: #795C26; /* 스크롤바 색상 */
        border-radius: 6px; /* 스크롤바 끝 모양 */
        border: 3px solid transparent; /* 안쪽 여백 효과 */
        background-clip: padding-box; /* 배경 잘림 방지 */
      }

      ::-webkit-scrollbar-track {
        background-color: rgba(0, 0, 0, 0.3); /* 트랙 색상 */
        border-radius: 6px;
      }

      #chatContainer {
        position: absolute; 
        left: 10px;
        bottom: 10px; 
        width: 300px;
        margin-bottom: 300px;
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      #chatLog {
        flex: 1; 
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* 최근 메시지를 아래쪽에 위치시킴 */
      }

      .chat-message {
        margin: 2px 0;
        line-height: 1.2em;
        font-size: 14px;
      }

      .nickname {
        font-weight: bold;
        margin-right: 4px;
      }
      .my-nickname {
        color: #41AED9;
      }
      .other-nickname {
        color: #D93636;
      }
      .chat-text {
        color: white;
      }

      #chatInput {
        display: none;       /* 처음엔 숨김. Enter키로 열기 */
        border: 1px solid #666;
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 4px;
        font-size: 14px;
        outline: none;
      }
      /* 디버그용 (현재 방 정보) */
      #roomInfo {
        position: absolute;
        top: 10px; 
        left: 10px; 
        color: #fff;
        z-index: 99999;
      }
    </style>
  </head>
  <body>
    <!-- <strong id="roomI nfo"></strong><br><br> -->
    <!-- 로비 화면 -->
    <div id="lobbyContainer">
      <img id="lobbyImage" src="loading.png" alt="loading">
      <!-- 진행바 (맨 아래 고정) -->
      <div class="progress-bar-wrapper">
        <!-- 프로필 이미지 영역 -->
        <div id="profileSection" style="display:none;">
          <img src="profile.png" alt="profile">
        </div>
        
        <!-- 그 다음 실제 progress bar -->
        <div class="progress-bar-container">
          <!-- 사다리꼴 (텍스트) 먼저 -->
          <div class="progress-trapezoid">
            <div id="progressText">0%</div>
          </div>
          <div id="progressBar"></div>
        </div>
        
      </div>
    </div>

    <!-- 카운트다운 화면 -->
    <div id="countdownContainer">
      <div id="countdownText">3</div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameContainer">
      <!-- 아래는 추가된 코드 (채팅 영역) -->
      <div id="chatContainer">
        <div id="chatLog"></div>
        <input id="chatInput" type="text" placeholder="메시지를 입력 후 Enter" />
      </div>
    </div>

    <!-- 현재 방 정보 표시 -->
    <strong id="roomInfo"></strong>

    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <script>
      // 서버와의 연결 설정
      const host = window.document.location.host.replace(/:.*/, '');

      const client = new Colyseus.Client(
        location.protocol.replace('http', 'ws') +
          '//' +
          host +
          (location.port ? ':' + location.port : '')
      );
      
      // URL에서 roomId 추출
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get('roomId');
      const nickname = urlParams.get('nickname') || "익명"; // 닉네임 기본값 설정

      // url 짧게 만들기(닉네임 안 보임)
      const originalUrl = window.location.href;
      const shortUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({ originalUrl }, document.title, shortUrl);

      let room;
      let isChatOpen = false;   // 채팅 입력창이 열려 있는지 여부

      let oldPlayerCount = 0;   // 이전 인원 (0,1,2...)
      let currentProgress = 0;  // 현재 진행(%) - 0→50→100

      // DOM 참조
      const lobbyContainer = document.getElementById('lobbyContainer');
      const lobbyImage = document.getElementById('lobbyImage');

      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const profileSection = document.getElementById('profileSection');

      const countdownContainer = document.getElementById('countdownContainer');
      const countdownText = document.getElementById('countdownText');
      const gameContainer = document.getElementById('gameContainer');
      const roomInfo = document.getElementById('roomInfo');

      const chatContainer = document.createElement("div");
      // 이미 HTML에 작성했다면, document.getElementById("chatContainer") 등으로 가져오세요.
      const chatLog = document.getElementById("chatLog");
      const chatInput = document.getElementById("chatInput");

      // 내 닉네임
      const myNickname = nickname;

      // 페이지 로드 시 로비 화면 표시
      lobbyContainer.style.display = "block";
      countdownContainer.style.display = "none";

      // 방 참여
      function joinRoom(roomId) {
        client.joinById(roomId, { nickname }).then((room_instance) => {
          room = room_instance;
          roomInfo.textContent = `방 참여 성공: ${room.id}`;
          setupRoomHandlers();
        }).catch((err) => {
          console.error(err);
          alert("방 참여 실패");
        });
      }

      // 페이지 로드 시 자동으로 방 참여
      if (roomId) {
        joinRoom(roomId);
      } else {
        alert('유효한 Room ID가 필요합니다.');
        // console.error('URL에서 Room ID를 찾을 수 없습니다.');
      }

      // **방 핸들러 설정 함수**
      function setupRoomHandlers() {
        // 1) 서버에서 "playerCount" 메시지를 받으면 -> 진행바 애니메이션
        room.onMessage("playerCount", (message) => {
          const newCount = message.count;
          updateProgress(newCount);
        });
        // 채팅 수신 처리
        room.onMessage("chat", (data) => {
          // data = { sessionId, nickname, text }
          displayChatMessage(data.sessionId, data.nickname, data.text);
        });

        // 플레이어 관리
        const players = {};
        const colors = ['red', 'green', 'yellow', 'blue', 'cyan', 'magenta'];

        // 마우스 위치 저장
        let mouseX = 0;
        let mouseY = 0;

        // 새로운 플레이어 추가
        room.state.players.onAdd(function (player, sessionId) {
          // 플레이어 DOM 추가
          const dom = document.createElement("div");
          dom.className = "player";
          dom.style.left = player.x + "px";
          dom.style.top = player.y + "px";
          dom.style.backgroundColor = "transparent";
          dom.style.backgroundImage = "url('mundo_ill.png')";
          dom.style.backgroundSize = "cover";
          dom.style.backgroundRepeat = "no-repeat";
          dom.style.backgroundPosition = "center";
          // dom.innerText = `Player ${sessionId}`;

          const userid = document.createElement("div");
          userid.innerText = `Player ${player.nickname}`;
          userid.style.textAlign = "center"; // 텍스트 중앙 정렬
          userid.style.marginTop = "60px";    // 이미지 아래 여백
          userid.style.color = "white";      // 텍스트 색상 변경
          dom.appendChild(userid);           // div 안에 텍스트 추가


          // HP 바 컨테이너 생성
          const hpBarContainer = document.createElement("div");
          hpBarContainer.className = "hp-bar-container";
          dom.appendChild(hpBarContainer);

          // HP 바 생성
          const hpBar = document.createElement("div");
          hpBar.className = "hp-bar";
          hpBar.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          // 나중에 화면마다 색 동일하도록 바꾸기기
          hpBar.style.width = "100%"; // 초기 HP 100%
          hpBarContainer.appendChild(hpBar);

          // 식칼 DOM 추가
          const knifeDom = document.createElement("img");
          knifeDom.className = "img";
          knifeDom.id = `knife-${sessionId}`;
          knifeDom.src = "bonesaw.png"; // 이미지 경로 설정
          knifeDom.style.position = "absolute";
          knifeDom.style.width = "60px";
          knifeDom.style.display = "none"; // 초기에는 보이지 않음
          knifeDom.style.transform = "translate(-50%, -50%)"; // 중앙 정렬
          gameContainer.appendChild(knifeDom);

          // 애니메이션 변수
          let currentX = player.x;
          let currentY = player.y;
          
          //좌우 반전 위해 이전 위치 저장
          let previousX = player.x;
          let previousY = player.y;

          function animate() {
              // 창 크기 얻기
              // const windowWidth = window.innerWidth;
              // const windowHeight = window.innerHeight;

              // // 원의 중심 (화면 중앙)
              // const centerX = windowWidth / 1.8;
              // const centerY = windowHeight / 2;

              // // 원의 반지름 (화면의 40% 크기)
              // const radius = Math.min(windowWidth, windowHeight) * 0.3;

              // // 플레이어의 x, y 좌표 계산
              // const dx = player.x - centerX;
              // const dy = player.y - centerY;
              // const distance = Math.sqrt(dx * dx + dy * dy); // 원의 중심과 플레이어의 거리

              // // 플레이어가 원을 벗어났다면, 원 위로 위치를 조정
              // if (distance > radius) {
              //     const angle = Math.atan2(dy, dx); // 플레이어가 원에서 차지하는 각도
              //     player.x = centerX + radius * Math.cos(angle); // 원 위의 x 위치 계산
              //     player.y = centerY + radius * Math.sin(angle); // 원 위의 y 위치 계산
              // }

              // 부드러운 이동 (보간)
              const speed = 0.1; // 이동 속도 (0 ~ 1 사이)
              currentX += (player.x - currentX) * speed;
              currentY += (player.y - currentY) * speed;

              // 방향에 따른 이미지 반전 (scaleX 사용)
              if (player.x > previousX) {
                  dom.style.transform = "scaleX(1)"; // 오른쪽 이동 시 정상 방향
              } else if (player.x < previousX) {
                  dom.style.transform = "scaleX(-1)"; // 왼쪽 이동 시 좌우 반전
              }
              // DOM 업데이트
              dom.style.left = `${currentX}px`;
              dom.style.top = `${currentY}px`;

              // 목표 위치에 거의 도달했는지 확인
              if (Math.abs(player.x - currentX) > 0.1 || Math.abs(player.y - currentY) > 0.1) {
                  requestAnimationFrame(animate); // 계속 애니메이션 실행
              }
              // 현재 위치를 이전 위치로 갱신
              previousX = player.x;
              previousY = player.y;

            }

          // 창 크기 변경 시 동적으로 범위가 업데이트되도록 이벤트 리스너 추가
          window.addEventListener('resize', animate);


          // 플레이어 업데이트
          player.onChange(function (changes) {
            // 플레이어 위치 업데이트
            requestAnimationFrame(animate);

            // HP 바 업데이트
            const hpPercentage = Math.max(player.hp, 0) + "%";
            hpBar.style.width = hpPercentage; // 남은 HP 비율만큼 바 너비 변경

            // hp끝나면 화면 종료
            room.send("finishScene");
            if (player.victoryNum === 1 && room.sessionId == sessionId) {
              cancelAnimationFrame(animate);
  
              // 승리 화면 띄우기
              const victoryContainer = document.createElement("div");
              victoryContainer.className = "victory-screen-container";
              gameContainer.appendChild(victoryContainer);

              const victoryVideo = document.createElement("img");
              victoryVideo.src = "victory.gif"; 
              victoryVideo.className = "victory-screen";
              victoryContainer.appendChild(victoryVideo);

              const buttonContainer = document.createElement("div");
              buttonContainer.className = "button-container";
              victoryContainer.appendChild(buttonContainer);

              const restartButton = document.createElement("button");
              restartButton.innerText = "Play Again";
              restartButton.className = "restart-button";
              restartButton.onclick = () => {
                room.send("buttonClicked"); //양쪽 다 버튼 선택했는지 확인(다시 시작 or 로비)
                if(room.state.selectButton === 2){
                  room.send("restartGame"); //서버도 리셋
                  // location.reload(); // 페이지 새로고침으로 게임 재시작
                  window.location.href = originalUrl;
                }
              };
              buttonContainer.appendChild(restartButton);

              const lobbyButton = document.createElement("button");
              lobbyButton.innerText = "Back Lobby";
              lobbyButton.className = "lobby-button";
              lobbyButton.onclick = () => {
                room.send("buttonClicked"); //양쪽 다 선택했는지 확인인
                window.location.href = "/07-custom-lobby-room.html";
              };
              buttonContainer.appendChild(lobbyButton);
            } 
            else if(player.victoryNum === 2 && room.sessionId == sessionId){
              cancelAnimationFrame(animate);

              // 패배 화면 띄우기
              const defeatContainer = document.createElement("div");
              defeatContainer.className = "victory-screen-container";
              gameContainer.appendChild(defeatContainer);

              const defeatVideo = document.createElement("img");
              defeatVideo.src = "defeat1.gif";
              defeatVideo.className = "victory-screen";
              defeatContainer.appendChild(defeatVideo);

              const buttonContainer = document.createElement("div");
              buttonContainer.className = "button-container";
              defeatContainer.appendChild(buttonContainer);

              const restartButton = document.createElement("button");
              restartButton.innerText = "Play Again";
              restartButton.className = "restart-button";
              restartButton.onclick = () => {
                room.send("buttonClicked"); //양쪽 다 버튼 선택했는지 확인(다시 시작 or 로비)
                if(room.state.selectButton === 2){
                  room.send("restartGame"); //서버도 리셋
                  // location.reload(); // 페이지 새로고침으로 게임 재시작
                  window.location.href = originalUrl;
                }
              };
              buttonContainer.appendChild(restartButton);

              const lobbyButton = document.createElement("button");
              lobbyButton.innerText = "Back Lobby";
              lobbyButton.className = "lobby-button";
              lobbyButton.onclick = () => {
                room.send("buttonClicked"); //양쪽 다 선택했는지 확인인
                window.location.href = "/07-custom-lobby-room.html";
              };
              buttonContainer.appendChild(lobbyButton);
            }

            // 플레이어 Knife 상태 업데이트
            if (player.knifeActive) {
              knifeDom.style.left = `${player.knifeX}px`;
              knifeDom.style.top = `${player.knifeY}px`;
              knifeDom.style.display = "block";
            } else {
              knifeDom.style.display = "none";
            }

          });

          players[sessionId] = dom;
          gameContainer.appendChild(dom);
        });

        // 플레이어 제거
        room.state.players.onRemove(function (player, sessionId) {
          if (players[sessionId]) {
            if (players[sessionId].parentNode) {
              players[sessionId].parentNode.removeChild(players[sessionId]);
            }
            delete players[sessionId];
          }
          const knifeDom = document.getElementById(`knife-${sessionId}`);
          if (knifeDom) {
            knifeDom.remove();
          }
        });

        // // 서버 메시지 핸들링 (필요 시)
        // room.onMessage("hello", (message) => {
        //   console.log(message);
        // });

        // 키보드 입력 감지 (칼 던지기)
        let canThrowKnife = true; // 쿨타임 상태를 추적하는 변수
        const knifeCooldown = 2000; // 쿨타임 시간 (밀리초)
        window.addEventListener("keydown", function (e) {
          if(room.state.gameOver) return;
          if (e.key === 'q' && canThrowKnife) {
            room.send("throwKnife", { targetX: mouseX, targetY: mouseY });
            canThrowKnife = false; // 쿨타임 시작
            setTimeout(() => { canThrowKnife = true; }, knifeCooldown);
          }
        });

        // 마우스 위치 찾기
        window.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        // 우클릭 이동
        window.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          room.send("moveTo", { x: e.clientX, y: e.clientY });
        });
      }

      // 채팅 메시지 표시 함수
      function displayChatMessage(sessionId, senderNickname, text) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("chat-message");

        const nicknameSpan = document.createElement("span");
        nicknameSpan.classList.add("nickname");

        if (sessionId === room.sessionId) {
          // 내 메시지
          nicknameSpan.classList.add("my-nickname");
        } else {
          // 상대 메시지
          nicknameSpan.classList.add("other-nickname");
        }
        nicknameSpan.textContent = "[전체] " + senderNickname + ": ";

        const textSpan = document.createElement("span");
        textSpan.classList.add("chat-text");
        textSpan.textContent = text;

        messageDiv.appendChild(nicknameSpan);
        messageDiv.appendChild(textSpan);

        chatLog.appendChild(messageDiv);

        // 스크롤 맨 아래로
        chatLog.scrollTop = chatContainer.scrollHeight;
        messageDiv.scrollIntoView({ behavior: 'smooth' });
      }

      // Enter 키 동작
      window.addEventListener("keydown", (e) => {
        // 채팅 입력창이 닫혀있는 상태에서 Enter 누르면 => 채팅 입력 열기
        if ((e.key === "Enter"  || e.keyCode === 13) && !isChatOpen) {
          isChatOpen = true;
          chatInput.style.display = "block";
          chatInput.focus();
          // 게임 캐릭터 움직임 단축키 등과 충돌하지 않도록 e.stopPropagation()을 쓸 수도 있음
        }
        // 채팅 입력창이 열려있는 상태에서 Enter 누르면 => 메시지 전송
        else if ((e.key === "Enter"  || e.keyCode === 13) && isChatOpen) {
          const text = chatInput.value.trim();
          if (text) {
            // 서버로 전송
            room.send("chat", text);
          }
          // 입력값 비우고 창 닫기
          chatInput.value = "";
          chatInput.style.display = "none";
          isChatOpen = false;
        }
        // 채팅창이 열려있는데 Esc 누르면 => 취소(닫기)
        else if (e.key === "Escape" && isChatOpen) {
          chatInput.value = "";
          chatInput.style.display = "none";
          isChatOpen = false;
        }
      });

        // ================================
      // 진행바 & 카운트다운 로직
      // ================================
      function updateProgress(newCount) {
        // 기존 인원 oldPlayerCount(0~2), 새 인원 newCount
        // 1명 -> 50%, 2명 -> 100%
        let targetProgress = 0;
        if (newCount === 1) {
          targetProgress = 50;
        } else if (newCount >= 2) {
          // 2명 이상 -> 100%
          profileSection.style.display = "block";
          targetProgress = 100;
        }

        animateProgress(currentProgress, targetProgress, () => {
          // 애니메이션 끝난 뒤 콜백
          currentProgress = targetProgress;

          // 2명이 된 후 => 100%라면 => 카운트다운 시작 (모두가 동일하게)
          if (currentProgress === 100) {
            // profile 표시
            // 약간 딜레이 주고 카운트다운
            setTimeout(() => { startCountdown(); }, 500);
          }
        });

        oldPlayerCount = newCount;
      }

      // 0→50 또는 50→100 으로 1초간 애니메이션
      function animateProgress(fromValue, toValue, onComplete) {
        let start = fromValue;
        const distance = toValue - fromValue;
        const duration = 1000; // 1초
        const startTime = performance.now();

        function tick(now) {
          const elapsed = now - startTime;
          const ratio = Math.min(elapsed / duration, 1);
          const newVal = start + distance * ratio;

          // 실제 반영
          progressBar.style.width = newVal + "%";
          progressText.textContent = Math.floor(newVal) + "%";

          if (ratio < 1) {
            requestAnimationFrame(tick);
          } else {
            // 완료
            if (onComplete) onComplete();
          }
        }
        requestAnimationFrame(tick);
      }

      // 카운트다운
      function startCountdown() {
        // 로비 감추고
        lobbyContainer.style.display = "none";
        // 카운트다운 노출
        countdownContainer.style.display = "flex";

        let count = 3;
        countdownText.textContent = count;
        const timer = setInterval(() => {
          count--;
          countdownText.textContent = count;
          if (count <= 0) {
            clearInterval(timer);
            countdownContainer.style.display = "none";
            // 게임 시작
            gameContainer.style.display = "block";
          }
        }, 1000);
      }
    
    </script>
  </body>

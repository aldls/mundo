<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <style>
      * {
        cursor: url('normal.cur'), auto; /* 사용자 정의 커서 */
      }

      body {
        margin: 0; 
        padding: 0;
        font-family: Tahoma, Geneva, sans-serif;
        overflow: auto; /* loading.png가 화면보다 크면 스크롤 가능 */
      }

      /* ===== 로비 화면 (loading.png 그대로 표시, ProgressBar는 화면 하단 고정) ===== */
      #lobbyContainer {
        display: none; /* 초기에 감춰두고, JS에서 제어 */
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* loading.png 원본 크기로 그대로 표시 */
      #lobbyImage {
        display: block;
        margin: 0 auto;
      }

      /* 바닥 고정 ProgressBar 영역 */
      .progress-bar-wrapper {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* 하나의 막대가 0~100% 로 채워짐 (색 동일) */
      #progressBar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%; /* JS에서 애니메이션 */
        background-color: #0FA697; 
        transition: width 1s ease; /* 1초 동안 부드럽게 */
      }
      /* 가운데 % 표시 */
      #progressText {
        position: absolute;
        width: 100%;
        line-height: 30px;
        text-align: center;
        color: #0FA697;
        top: 0;
        left: 0;
      }
      .progress-bar-container {
        position: relative;
        width: 420px;
        height: 5px;
        background-color: #0B1C26;
        border-radius: 5px;
        margin-bottom: 5px;
        border: 2px solid #695840; /* 테두리 색상과 두께 설정 */
      }

      .progress-trapezoid {
        position: absolute;
        top: -25px;       /* bar-container의 위로 튀어나옴 */
        left: 50%;
        transform: translateX(-50%);
        width: 64px;      /* 테두리 때문에 크기 약간 키움 */
        height: 24px;     /* 테두리 때문에 크기 약간 키움 */
        background: #695840;             /* 테두리 색상 */
        clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;

        /* 내부 사다리꼴 */
        position: relative;
      }
      .progress-trapezoid::after {
        content: '';                       /* 가상 요소 */
        position: absolute;
        top: 2px;                          /* 테두리 두께 */
        left: 2px;
        right: 2px;
        bottom: 2px;
        background: #05131D;               /* 내부 사다리꼴 색상 */
        clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        z-index: -1;                       /* 부모 위로 나오지 않도록 */
      }


      /* 상대방 들어왔을 때 보여줄 큰 profile.png */
      #profileSection {
        display: none;
      }

      /* ===== 카운트다운 화면 ===== */
      #countdownContainer {
        display: none; 
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.8);
        color: #fff;
        font-size: 3em;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ===== 게임 화면 ===== */
      #gameContainer {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url('game_background.png');
        background-size: 100vw 100vh;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      /* ===== 플레이어 ===== */
      .player {
        width: 100px;
        height: 100px;
        position: absolute;
        padding-top: 24px;
        box-sizing: border-box;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
      }
      .hp-bar-container {
        position: absolute;
        width: 100px;
        height: 10px;
        background-color: black;
        border: 1px solid #333;
        top: -15px;
      }
      .hp-bar {
        height: 100%;
      }
      .img {
        animation: rotate_image 1s linear infinite;
        transform-origin: 50% 50%;
      }
      @keyframes rotate_image {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }

      /* 디버그용 (현재 방 정보) */
      #roomInfo {
        position: absolute;
        top: 10px; 
        left: 10px; 
        color: #fff;
        z-index: 99999;
      }

      /* 채팅 관련련 */
      ::-webkit-scrollbar {
        width: 12px; /* 스크롤바 너비 */
      }

      ::-webkit-scrollbar-thumb {
        background-color: #795C26; /* 스크롤바 색상 */
        border-radius: 6px; /* 스크롤바 끝 모양 */
        border: 3px solid transparent; /* 안쪽 여백 효과 */
        background-clip: padding-box; /* 배경 잘림 방지 */
      }

      ::-webkit-scrollbar-track {
        background-color: rgba(0, 0, 0, 0.3); /* 트랙 색상 */
        border-radius: 6px;
      }


      #chatContainer {
        position: absolute; 
        left: 10px;
        bottom: 10px; 
        width: 300px;
        margin-bottom: 300px;
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      #chatLog {
        flex: 1; 
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* 최근 메시지를 아래쪽에 위치시킴 */
      }

      .chat-message {
        margin: 2px 0;
        line-height: 1.2em;
        font-size: 14px;
      }

      .nickname {
        font-weight: bold;
        margin-right: 4px;
      }
      .my-nickname {
        color: #41AED9;
      }
      .other-nickname {
        color: #D93636;
      }
      .chat-text {
        color: white;
      }

      #chatInput {
        display: none;       /* 처음엔 숨김. Enter키로 열기 */
        border: 1px solid #666;
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 4px;
        font-size: 14px;
        outline: none;
      }

      /************************************
      * 스킬 아이콘 (하단 중앙)
      ************************************/
      #skillContainer {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);

        width: 128px;         /* 크기 2배 키우기 */
        height: 128px;
        border: 8px solid #A09B8C;  /* 평소 테두리 색 */
        border-radius: 50%;
        box-sizing: border-box;
        z-index: 2000;
        
        /* 마우스 오버하면 툴팁 표시 */
        /* (기본값: display: none; => hover 시 block) */
      }

      #skillIcon {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: block;
      }

      /* 쿨타임 오버레이 (처음에는 숨김) */
      #skillOverlay {
        position: absolute;
        top: 0; 
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        pointer-events: none;
        display: none;  /* 처음에는 숨김 → 스킬 사용하면 block */
      }

      /* 남은 쿨타임 숫자 */
      #skillText {
        position: absolute;
        top: 50%; 
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;       /* 아이콘 커졌으니 폰트도 키움 */
        font-weight: bold;
        pointer-events: none;
      }

      /* Q 표시 (아이콘 왼쪽 아래 구석) */
      #skillKey {
        position: absolute;
        bottom: 4px; 
        left: 4px;
        color: white;
        font-weight: bold;
        font-size: 18px;
        pointer-events: none;
        text-shadow: 1px 1px 2px black;
      }

      /************************************
      * 스킬 툴팁
      ************************************/
      #skillTooltip {
        position: absolute;
        bottom: 135px; /* 아이콘 위쪽에 배치 */
        left: 50%;
        transform: translateX(-50%);
        
        display: none; /* 기본적으로 숨김 */
        width: 600px; /* 이미지의 적절한 크기로 조정 */
        pointer-events: none; /* 마우스가 툴팁으로 가도 사라지지 않도록 */
      }
      #skillTooltip img {
        width: 100%;
        height: auto;
        display: block;
      }
      /* 아이콘에 마우스를 올리면 툴팁 이미지 표시 */
      #skillContainer:hover #skillTooltip {
          display: block;
      }

      #gogoEffect {
        animation: fadeOut 0.8s forwards;
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /************************************
      * F 점멸
      ************************************/
      #flashContainer {
        position: absolute;
        bottom: 20px;
        left: calc(50% + 150px); /* Q 스킬보다 오른쪽으로 150px 정도 옮김 */
        transform: translateX(-50%);
        width: 128px;
        height: 128px;
        border: 8px solid #A09B8C;
        border-radius: 50%;
        box-sizing: border-box;
        z-index: 2000;
      }

      #flashIcon {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: block;
      }

      #flashOverlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border-radius: 50%;
        pointer-events: none;
        display: none;
      }

      #flashText {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
        pointer-events: none;
      }

      #flashKey {
        position: absolute;
        bottom: 4px; left: 4px;
        color: white;
        font-weight: bold;
        font-size: 18px;
        pointer-events: none;
        text-shadow: 1px 1px 2px black;
      }
      .flash-gold {
        animation: flashGold 0.15s;
      }

      @keyframes flashGold {
        0% { filter: brightness(100%); }
        50% { filter: brightness(250%); } /* 밝게 -> 다시 원상태 */
        100% { filter: brightness(100%); }
      }

    </style>
  </head>
  <body>
    <!-- 로비 화면 -->
    <div id="lobbyContainer">
      <img id="lobbyImage" src="loading.png" alt="loading">
      <!-- 진행바 (맨 아래 고정) -->
      <div class="progress-bar-wrapper">
        <!-- 프로필 이미지 영역 -->
        <div id="profileSection" style="display:none;">
          <img src="profile.png" alt="profile">
        </div>
        
        <!-- 그 다음 실제 progress bar -->
        <div class="progress-bar-container">
          <!-- 사다리꼴 (텍스트) 먼저 -->
          <div class="progress-trapezoid">
            <div id="progressText">0%</div>
          </div>
          <div id="progressBar"></div>
        </div>

      </div>
    </div>

    <!-- 카운트다운 화면 -->
    <div id="countdownContainer">
      <div id="countdownText">3</div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameContainer">
      <div id="gogoEffect" style="display: none; position: absolute;">
        <img src="gogo.png" alt="GoGo Effect" style="width: 50px; height: 50px;">
      </div>

      <!-- (채팅 영역) -->
      <div id="chatContainer">
        <div id="chatLog"></div>
        <input id="chatInput" type="text" placeholder="메시지를 입력 후 Enter" />
      </div>

      <!-- 여기에 스킬 UI 추가 -->
      <div id="skillContainer">
        <!-- skill.png 아이콘 -->
        <img id="skillIcon" src="skill.png" alt="skill" />
    
        <!-- 쿨타임 진행도를 보여줄 반투명 원형 오버레이 -->
        <div id="skillOverlay"></div>
    
        <!-- 남은 쿨타임 초 표시 영역 -->
        <div id="skillText"></div>
    
        <!-- Q 표시 -->
        <div id="skillKey">Q</div>

        <!-- 마우스 오버 시 표시할 툴팁 -->
        <div id="skillTooltip">
          <img src="skill_detail.png" alt="스킬 툴팁 이미지">
        </div>
      </div>
        <!-- F (flash) 스킬 아이콘 -->
      <div id="flashContainer">
        <img id="flashIcon" src="flash.jpg" alt="flash"/>
        <div id="flashOverlay"></div>
        <div id="flashText"></div>
        <div id="flashKey">F</div>
      </div>

    </div>  

    <!-- 현재 방 정보 표시 -->
    <strong id="roomInfo"></strong>

    <!-- Colyseus Client -->
    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <script>
      // 서버 연결
      const host = window.document.location.host.replace(/:.*/, '');
      const client = new Colyseus.Client(
        location.protocol.replace('http', 'ws') + '//' + host + (location.port ? ':' + location.port : '')
      );

      // URL 파라미터
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get('roomId');
      const nickname = urlParams.get('nickname') || "익명";

      let room;
      let isChatOpen = false; // 채팅 입력창이 열려 있는지 여부

      let oldPlayerCount = 0;   // 이전 인원 (0,1,2...)
      let currentProgress = 0;  // 현재 진행(%) - 0→50→100

      // DOM 참조
      const lobbyContainer = document.getElementById('lobbyContainer');
      const lobbyImage = document.getElementById('lobbyImage');

      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const profileSection = document.getElementById('profileSection');

      const countdownContainer = document.getElementById('countdownContainer');
      const countdownText = document.getElementById('countdownText');
      const gameContainer = document.getElementById('gameContainer');
      const roomInfo = document.getElementById('roomInfo');

      // DOM 참조
      const chatContainer = document.createElement("div");
      // 이미 HTML에 작성했다면, document.getElementById("chatContainer") 등으로 가져오세요.
      const chatLog = document.getElementById("chatLog");
      const chatInput = document.getElementById("chatInput");

      // 내 닉네임
      const myNickname = nickname;

      // 페이지 로드 시 로비 화면 표시
      lobbyContainer.style.display = "block";
      countdownContainer.style.display = "none";

      // 점멸 사운드
      const flashSound = new Audio("flashSound.mp3"); 
      flashSound.volume = 0.8; // 볼륨 조정 등

      // 방 참여
      function joinRoom(roomId) {
        client.joinById(roomId, { nickname }).then((room_instance) => {
          room = room_instance;
          roomInfo.textContent = `방 참여 성공: ${room.id}`;
          setupRoomHandlers();
        }).catch((err) => {
          console.error(err);
          alert("방 참여 실패");
        });
      }

      // URL에 roomId가 있으면 자동 참여
      if (roomId) {
        joinRoom(roomId);
      } else {
        alert("유효한 roomId가 없습니다.");
      }

      // ================================
      // 서버 메시지 & Room 핸들러 설정
      // ================================
      function setupRoomHandlers() {
        // 1) 서버에서 "playerCount" 메시지를 받으면 -> 진행바 애니메이션
        room.onMessage("playerCount", (message) => {
          const newCount = message.count;
          updateProgress(newCount);
        });

        // 채팅 수신 처리
        room.onMessage("chat", (data) => {
          // data = { sessionId, nickname, text }
          displayChatMessage(data.sessionId, data.nickname, data.text);
        });

        // 2) Colyseus의 state.players 사용
        const players = {};
        const colors = ["red", "green", "yellow", "blue", "cyan", "magenta"];
        let mouseX = 0, mouseY = 0;

        // 플레이어 추가
        room.state.players.onAdd((player, sessionId) => {
          // DOM 생성
          const dom = document.createElement("div");
          dom.className = "player";
          dom.style.backgroundImage = "url('mundoface.png')";
          dom.style.backgroundSize = "cover";
          dom.style.backgroundRepeat = "no-repeat";
          dom.style.backgroundPosition = "center";

          const userid = document.createElement("div");
          userid.innerText = `Player ${player.nickname}`;
          userid.style.textAlign = "center";
          userid.style.marginTop = "60px";
          userid.style.color = "white";
          dom.appendChild(userid);

          const hpBarContainer = document.createElement("div");
          hpBarContainer.className = "hp-bar-container";
          dom.appendChild(hpBarContainer);

          const hpBar = document.createElement("div");
          hpBar.className = "hp-bar";
          hpBar.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          hpBar.style.width = "100%";
          hpBarContainer.appendChild(hpBar);

          const knifeDom = document.createElement("img");
          knifeDom.className = "img";
          knifeDom.id = `knife-${sessionId}`;
          knifeDom.src = "bonesaw.png";
          knifeDom.style.position = "absolute";
          knifeDom.style.width = "60px";
          knifeDom.style.display = "none";
          knifeDom.style.transform = "translate(-50%, -50%)";
          gameContainer.appendChild(knifeDom);

          let currentX = player.x;
          let currentY = player.y;
          function animate() {
            const speed = 0.1;
            currentX += (player.x - currentX) * speed;
            currentY += (player.y - currentY) * speed;
            dom.style.left = `${currentX}px`;
            dom.style.top = `${currentY}px`;
            if (Math.abs(player.x - currentX) > 0.1 || Math.abs(player.y - currentY) > 0.1) {
              requestAnimationFrame(animate);
            }
          }
          window.addEventListener('resize', animate);

          player.onChange(() => {
            // 점멸 여부 체크
            if (player.teleport) {
              // 즉시 갱신
              currentX = player.x;
              currentY = player.y;
              dom.style.left = `${currentX}px`;
              dom.style.top = `${currentY}px`;

              // 황금빛 깜빡임(섬광)
              // CSS 클래스 추가 또는 인라인 스타일로 잠깐 색상 변경
              dom.classList.add("flash-gold");
              setTimeout(() => {
                dom.classList.remove("flash-gold");
              }, 150); // 0.15초 정도 깜빡임

              // teleport 플래그를 false로 (이후 이동은 정상 애니메이션)
              player.teleport = false;
            } else {
              // 평소 이동은 부드러운 애니메이션
              requestAnimationFrame(animate);
            }

            // HP
            const hpPercent = Math.max(player.hp, 0) + "%";
            hpBar.style.width = hpPercent;

            // 승리/패배
            if (player.victoryNum === 1 && room.sessionId === sessionId) {
              const victoryVideo = document.createElement("img");
              victoryVideo.src = "victory.gif";
              victoryVideo.style.position = "fixed";
              victoryVideo.style.top = "50%";
              victoryVideo.style.left = "50%";
              victoryVideo.style.transform = "translate(-50%, -50%)";
              victoryVideo.style.width = "80%";
              victoryVideo.style.zIndex = "1000";
              document.body.appendChild(victoryVideo);
            } else if (player.victoryNum === 2 && room.sessionId === sessionId) {
              const defeatVideo = document.createElement("img");
              defeatVideo.src = "defeat1.gif";
              defeatVideo.style.position = "fixed";
              defeatVideo.style.top = "50%";
              defeatVideo.style.left = "50%";
              defeatVideo.style.transform = "translate(-50%, -50%)";
              defeatVideo.style.width = "80%";
              defeatVideo.style.zIndex = "1000";
              document.body.appendChild(defeatVideo);
            }

            // 칼 상태
            if (player.knifeActive) {
              knifeDom.style.left = `${player.knifeX}px`;
              knifeDom.style.top = `${player.knifeY}px`;
              knifeDom.style.display = "block";
            } else {
              knifeDom.style.display = "none";
            }
          });

          players[sessionId] = dom;
          gameContainer.appendChild(dom);
        });

        // 플레이어 제거
        room.state.players.onRemove((player, sessionId) => {
          if (players[sessionId]) {
            if (players[sessionId].parentNode) {
              players[sessionId].parentNode.removeChild(players[sessionId]);
            }
            delete players[sessionId];
          }
          const knifeDom = document.getElementById(`knife-${sessionId}`);
          if (knifeDom) {
            knifeDom.remove();
          }
        });

        // 칼 던지기
        let canThrowKnife = true;
        const knifeCooldown = 2000;

        const skillContainer = document.getElementById("skillContainer");
        const skillOverlay   = document.getElementById("skillOverlay");
        const skillText      = document.getElementById("skillText");
        window.addEventListener("keydown", (e) => {
          if (isChatOpen) return;

          if (e.key === 'q' && canThrowKnife) {
            room.send("throwKnife", { targetX: mouseX, targetY: mouseY });
            startSkillCooldown(2); // 2초 쿨타임 시작 (단위: '초')
          }
        });

        /**
         * 스킬 쿨타임 UI 시작
         * @param {number} totalSeconds - 전체 쿨타임 (초)
         */
        function startSkillCooldown(totalSeconds) {
          canThrowKnife = false;                      // 스킬 잠금
          skillContainer.style.borderColor = "#1E282D"; // 쿨도는 동안 테두리 색

          // 쿨타임 오버레이 초기화 (파이 전부 채워진 상태)
          skillOverlay.style.display = "block";
          skillOverlay.style.background =
            "conic-gradient(#053959 0deg, #053959 360deg)";

          // 남은 시간
          let timeLeft = totalSeconds;
          skillText.textContent = Math.ceil(timeLeft);

          // 0.1초 간격으로 쿨타임 갱신 (애니메이션 더 부드럽게 하려면 0.05초 등으로 줄여도 됨)
          const interval = setInterval(() => {
            timeLeft -= 0.1;

            // 0초 이하 => 쿨타임 종료
            if (timeLeft <= 0) {
              clearInterval(interval);
              skillText.textContent = "";                 // 남은 초 제거
              skillOverlay.style.background = "none";     // 오버레이 제거
              skillContainer.style.borderColor = "#A09B8C"; // 다시 원래 테두리색
              canThrowKnife = true;                       // 스킬 사용 가능
              return;
            }

            // 진행 각도(0~360)
            // timeLeft가 2초->0초로 갈수록 360->0도가 되어야 하므로
            // angle = (timeLeft / totalSeconds) * 360
            const angle = (timeLeft / totalSeconds) * 360;
            const temp_angle = 360 - angle
            // 오버레이 업데이트
            // 12시부터 시계방향으로 #053959(남은 쿨) -> 그 외는 transparent
            skillOverlay.style.background =
              `conic-gradient(transparent 0deg, transparent ${temp_angle}deg, #053959 ${temp_angle}deg, #053959 360deg)`;

            // 남은 시간(초)를 소수점 올림해서 표시 (1.9초 -> 2초로 보이게)
            skillText.textContent = Math.ceil(timeLeft);
          }, 100); // 0.1초마다 갱신
        }

        // 마우스
        window.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        // DOM 참조
        const gogoEffect = document.getElementById("gogoEffect");
        let gogoTimeout = null; // 기존 타이머를 저장할 변수

        // 우클릭 이동
        window.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          room.send("moveTo", { x: e.clientX, y: e.clientY });
          
          // 클릭 위치에 이미지 이동
          gogoEffect.style.left = `${e.clientX - 25}px`; // 이미지 중심으로 정렬
          gogoEffect.style.top = `${e.clientY - 25}px`;

          // 애니메이션 초기화
          gogoEffect.style.display = "none"; // 강제로 숨겼다가
          void gogoEffect.offsetWidth; // DOM 리플로우 강제 트리거
          gogoEffect.style.display = "block"; // 다시 표시

          // 애니메이션 강제 재시작
          gogoEffect.style.animation = "none"; // 기존 애니메이션 제거
          setTimeout(() => {
            gogoEffect.style.animation = "fadeOut 0.8s forwards"; // 애니메이션 다시 추가
          }, 0);

          // 기존 타이머가 있으면 취소
          if (gogoTimeout) {
            clearTimeout(gogoTimeout);
          }

          // 새로운 타이머 설정 (0.8초 후 이미지 숨김)
          gogoTimeout = setTimeout(() => {
            gogoEffect.style.display = "none";
          }, 800); // 애니메이션과 동일한 시간 설정
        });

        // flashEffect 수신 -> 모든 클라이언트가 twinkle.png 효과 표시
        room.onMessage("flashEffect", (data) => {
          const { sessionId, fromX, fromY, toX, toY } = data;

          // 1) from 지점에 twinkle.png
          showTwinkleEffect(fromX, fromY);

          // 2) to 지점에도 twinkle.png
          showTwinkleEffect(toX, toY);

          // 3) 사운드 재생 (모두가 들을지, 본인만 들을지는 기획에 맞춰 결정)
          flashSound.currentTime = 0;
          flashSound.play().catch(e => console.log("Audio play interrupted:", e));
        });

        // ... 플레이어 onAdd, onRemove, throwKnife, etc. 생략 ...

        //  f 키 -> flash 사용
        let canFlash = true;
        const flashCooldown = 300; // 300초 (5분)

        window.addEventListener("keydown", (e) => {
          if (isChatOpen) return;  // 채팅창 열려있으면 스킬 막음

          // f 키
          if (e.key === 'f' && canFlash) {
            // 서버로 "flash" 메시지 전송
            room.send("flash", { targetX: mouseX, targetY: mouseY });

            // 쿨타임 시작
            startFlashCooldown(flashCooldown);
          }
        });

        const flashContainer = document.getElementById("flashContainer");
        const flashOverlay   = document.getElementById("flashOverlay");
        const flashText      = document.getElementById("flashText");

        /**
         * f 스킬(점멸) 쿨타임 UI
         * @param {number} totalSeconds - 300초
         */
        function startFlashCooldown(totalSeconds) {
          canFlash = false;
          flashContainer.style.borderColor = "#1E282D"; // 쿨타임 동안 테두리 색상 변경

          // 쿨타임 오버레이 초기화 (파이 전체 채움 상태)
          flashOverlay.style.display = "block";
          flashOverlay.style.background = "conic-gradient(#053959 0deg, #053959 360deg)";

          let timeLeft = totalSeconds;
          flashText.textContent = Math.ceil(timeLeft);

          const interval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
              clearInterval(interval);
              flashText.textContent = "";
              flashOverlay.style.background = "none";
              flashOverlay.style.display = "none";
              flashContainer.style.borderColor = "#A09B8C"; 
              canFlash = true;
              return;
            }

            // 0 → 360도로 줄어드는 애니메이션
            const angle = (timeLeft / totalSeconds) * 360;
            const temp_angle = 360 - angle;
            flashOverlay.style.background =
              `conic-gradient(transparent 0deg, transparent ${temp_angle}deg, #053959 ${temp_angle}deg, #053959 360deg)`;

            flashText.textContent = Math.ceil(timeLeft);
          }, 100);
        }

        // twinkle.png 이펙트 표시 함수
        function showTwinkleEffect(x, y) {
          const twinkle = document.createElement("img");
          twinkle.src = "twinkle.png";
          twinkle.style.position = "absolute";
          twinkle.style.width = "100px";
          twinkle.style.height = "100px";
          twinkle.style.left = `${x - 30}px`;
          twinkle.style.top = `${y - 30}px`;
          twinkle.style.pointerEvents = "none";
          twinkle.style.animation = "fadeOut 0.8s forwards";

          gameContainer.appendChild(twinkle);

          // 0.8초 후 자동 제거
          setTimeout(() => {
            gameContainer.removeChild(twinkle);
          }, 800);
        }
      }

      // 채팅 메시지 표시 함수
      function displayChatMessage(sessionId, senderNickname, text) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("chat-message");

        const nicknameSpan = document.createElement("span");
        nicknameSpan.classList.add("nickname");

        if (sessionId === room.sessionId) {
          // 내 메시지
          nicknameSpan.classList.add("my-nickname");
        } else {
          // 상대 메시지
          nicknameSpan.classList.add("other-nickname");
        }
        nicknameSpan.textContent = "[전체] " + senderNickname + ": ";

        const textSpan = document.createElement("span");
        textSpan.classList.add("chat-text");
        textSpan.textContent = text;

        messageDiv.appendChild(nicknameSpan);
        messageDiv.appendChild(textSpan);

        chatLog.appendChild(messageDiv);

        // 스크롤 맨 아래로
        chatLog.scrollTop = chatContainer.scrollHeight;
        messageDiv.scrollIntoView({ behavior: 'smooth' });
      }

      // Enter 키 동작
      window.addEventListener("keydown", (e) => {
        // 채팅 입력창이 닫혀있는 상태에서 Enter 누르면 => 채팅 입력 열기
        if ((e.key === "Enter"  || e.keyCode === 13) && !isChatOpen) {
          isChatOpen = true;
          chatInput.style.display = "block";
          chatInput.focus();
          // 게임 캐릭터 움직임 단축키 등과 충돌하지 않도록 e.stopPropagation()을 쓸 수도 있음
        }
        // 채팅 입력창이 열려있는 상태에서 Enter 누르면 => 메시지 전송
        else if ((e.key === "Enter"  || e.keyCode === 13) && isChatOpen) {
          const text = chatInput.value.trim();
          if (text) {
            // 서버로 전송
            room.send("chat", text);
          }
          // 입력값 비우고 창 닫기
          chatInput.value = "";
          chatInput.style.display = "none";
          isChatOpen = false;
        }
        // 채팅창이 열려있는데 Esc 누르면 => 취소(닫기)
        else if (e.key === "Escape" && isChatOpen) {
          chatInput.value = "";
          chatInput.style.display = "none";
          isChatOpen = false;
        }
      });

      // ================================
      // 진행바 & 카운트다운 로직
      // ================================
      function updateProgress(newCount) {
        // 기존 인원 oldPlayerCount(0~2), 새 인원 newCount
        // 1명 -> 50%, 2명 -> 100%
        let targetProgress = 0;
        if (newCount === 1) {
          targetProgress = 50;
        } else if (newCount >= 2) {
          // 2명 이상 -> 100%
          profileSection.style.display = "block";
          targetProgress = 100;
        }

        animateProgress(currentProgress, targetProgress, () => {
          // 애니메이션 끝난 뒤 콜백
          currentProgress = targetProgress;

          // 2명이 된 후 => 100%라면 => 카운트다운 시작 (모두가 동일하게)
          if (currentProgress === 100) {
            // profile 표시
            // 약간 딜레이 주고 카운트다운
            setTimeout(() => { startCountdown(); }, 500);
          }
        });

        oldPlayerCount = newCount;
      }

      // 0→50 또는 50→100 으로 1초간 애니메이션
      function animateProgress(fromValue, toValue, onComplete) {
        let start = fromValue;
        const distance = toValue - fromValue;
        const duration = 1000; // 1초
        const startTime = performance.now();

        function tick(now) {
          const elapsed = now - startTime;
          const ratio = Math.min(elapsed / duration, 1);
          const newVal = start + distance * ratio;

          // 실제 반영
          progressBar.style.width = newVal + "%";
          progressText.textContent = Math.floor(newVal) + "%";

          if (ratio < 1) {
            requestAnimationFrame(tick);
          } else {
            // 완료
            if (onComplete) onComplete();
          }
        }
        requestAnimationFrame(tick);
      }

      // 카운트다운
      function startCountdown() {
        // 로비 감추고
        lobbyContainer.style.display = "none";
        // 카운트다운 노출
        countdownContainer.style.display = "flex";

        let count = 3;
        countdownText.textContent = count;
        const timer = setInterval(() => {
          count--;
          countdownText.textContent = count;
          if (count <= 0) {
            clearInterval(timer);
            countdownContainer.style.display = "none";
            // 게임 시작
            gameContainer.style.display = "block";
          }
        }, 1000);
      }
    </script>
  </body>
</html>

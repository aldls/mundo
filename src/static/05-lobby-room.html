<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />

    <style>
      body { font-family: Tahoma, Geneva, sans-serif; }
      .player {
        width: 100px;
        height: 100px;
        position: absolute;
        padding-top: 24px;
        box-sizing: border-box;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%); /* 중앙 정렬 */
      }
      .userid {
        position: absolute;
        width: 100px;
        height: 10px;
        background-color: transparent; /* HP 바의 배경 (깎인 부분) */
        /* border: 1px solid #333; 테두리 */
        top: -15px; /* 캐릭터 위에 위치하도록 조정 */
      }
      .hp-bar-container {
        position: absolute;
        width: 100px;
        height: 10px;
        background-color: black; /* HP 바의 배경 (깎인 부분) */
        border: 1px solid #333; /* 테두리 */
        top: -15px; /* 캐릭터 위에 위치하도록 조정 */
      }
      .hp-bar {
        height: 100%; /* HP 바 높이 */
      }
      .img {
        animation: rotate_image 1s linear infinite; /* 1초 동안 회전, 무한 반복 */
        transform-origin: 50% 50%; /* 중앙을 기준으로 회전 */
      }
      @keyframes rotate_image {
        from {
          transform: rotate(0deg); /* 시작 각도 */
        }
        to {
          transform: rotate(-360deg); /* 끝 각도 (시계 반대방향) */
        }
      }
      /* #roomInfo {
        margin-top: 20px;
      } */
    </style>
  </head>
  <body>
    <strong id="roomInfo">Room Management</strong><br><br>

    <!-- **방 ID 입력 및 참여 인터페이스** -->
    <input type="text" id="roomIdInput" placeholder="Enter Room ID" />
    <button id="joinButton">Join Room by ID</button>

    <br><br>

    <!-- **방 생성 버튼 및 방 ID 표시** -->
    <button id="createButton">Create New Room</button>
    <!-- <div id="roomInfo"></div> -->

    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <script>
      // 서버와의 연결 설정
      const host = window.document.location.host.replace(/:.*/, '');
      const client = new Colyseus.Client(
        location.protocol.replace('http', 'ws') +
          '//' +
          host +
          (location.port ? ':' + location.port : '')
      );
      
      // URL에서 roomId 추출
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get('roomId');
      const nickname = urlParams.get('nickname') || "익명"; // 닉네임 기본값 설정
      let room;

      // 방에 참여하는 함수
      function joinRoom(roomId) {
        client
          .joinById(roomId, { nickname })
          .then((room_instance) => {
            room = room_instance;
            document.getElementById('roomInfo').innerText = `방에 성공적으로 참여했습니다: ${room.id}`;
            console.log(`닉네임: ${nickname}, 방에 성공적으로 참여했습니다: ${room.id}`);
            setupRoomHandlers();
          })
          .catch((e) => {
            console.error('방 참여 실패:', e);
            alert('방 참여에 실패했습니다. 올바른 방 ID인지 확인하세요.');
          });
      }

      // 페이지 로드 시 자동으로 방 참여
      if (roomId) {
        joinRoom(roomId);
      } else {
        alert('유효한 Room ID가 필요합니다.');
        console.error('URL에서 Room ID를 찾을 수 없습니다.');
      }

      // **방에 참여하는 함수**
      function joinRoomById(roomId) {
        client.joinById(roomId).then(room_instance => {
          room = room_instance;
          console.log(`방에 성공적으로 참여했습니다: ${room.id}`);
          setupRoomHandlers();
        }).catch(e => {
          console.error("방 참여 실패:", e);
          alert("방 참여에 실패했습니다. 올바른 방 ID인지 확인하세요.");
        });
      }

      // **새로운 방을 생성하는 함수**
      function createNewRoom() {
        client.create("state_handler").then(room_instance => {
          room = room_instance;
          console.log(`새로운 방을 생성했습니다: ${room.id}`);
          document.getElementById("roomInfo").innerText = `방 ID: ${room.id} (공유하여 다른 사용자가 참여할 수 있습니다.)`;
          setupRoomHandlers();
        }).catch(e => {
          console.error("방 생성 실패:", e);
          alert("방 생성에 실패했습니다.");
        });
      }

      // **방 핸들러 설정 함수**
      function setupRoomHandlers() {
        // 게임 시작시 버튼 없애기
        document.getElementById("roomInfo").innerText = `방 ID: ${room.id} (공유하여 다른 사용자가 참여할 수 있습니다.)`;
        document.getElementById("roomInfo").style.color = "white";
        document.body.style.backgroundImage = "url('game_background.png')";
        document.body.style.backgroundSize = "100vw 100vh"; // 뷰포트 기준 크기 고정
        document.body.style.backgroundRepeat = "no-repeat";
        
        //게임 실행하며 그 전 요소들 지우기
        const createButton = document.getElementById("createButton");
        const joinButton = document.getElementById("joinButton");
        const roomIdInput = document.getElementById("roomIdInput");
          if (createButton || joinButton) {
            createButton.style.display = "none"; // 버튼 숨기기
            joinButton.style.display = "none";
            roomIdInput.style.display = "none";
          }

        // 플레이어 관리
        var players = {};
        var colors = ['red', 'green', 'yellow', 'blue', 'cyan', 'magenta'];

        // 마우스 위치 저장
        let mouseX = 0;
        let mouseY = 0;

        // 새로운 플레이어 추가
        room.state.players.onAdd(function (player, sessionId) {
          // 플레이어 DOM 추가
          const dom = document.createElement("div");
          dom.className = "player";
          dom.style.left = player.x + "px";
          dom.style.top = player.y + "px";
          // dom.style.background = colors[Math.floor(Math.random() * colors.length)];
          dom.style.backgroundColor = "transparent";
          dom.style.backgroundImage = "url('mundoface.png')";
          dom.style.backgroundSize = "cover";
          dom.style.backgroundRepeat = "no-repeat";
          dom.style.backgroundPosition = "center";
          // dom.innerText = `Player ${sessionId}`;

          const userid = document.createElement("div");
          userid.innerText = `Player ${sessionId}`;
          userid.style.textAlign = "center"; // 텍스트 중앙 정렬
          userid.style.marginTop = "60px";    // 이미지 아래 여백
          userid.style.color = "white";      // 텍스트 색상 변경
          dom.appendChild(userid);           // div 안에 텍스트 추가


          // HP 바 컨테이너 생성
          const hpBarContainer = document.createElement("div");
          hpBarContainer.className = "hp-bar-container";
          dom.appendChild(hpBarContainer);

          // HP 바 생성
          const hpBar = document.createElement("div");
          hpBar.className = "hp-bar";
          // hpBar.style.backgroundColor = dom.style.background; // 플레이어 색과 동일
          hpBar.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          // 나중에 화면마다 색 동일하도록 바꾸기기
          hpBar.style.width = "100%"; // 초기 HP 100%
          hpBarContainer.appendChild(hpBar);

          // 식칼 DOM 추가
          const knifeDom = document.createElement("img");
          knifeDom.className = "img";
          knifeDom.id = `knife-${sessionId}`;
          knifeDom.src = "bonesaw.png"; // 이미지 경로 설정
          knifeDom.style.position = "absolute";
          knifeDom.style.width = "60px";
          knifeDom.style.display = "none"; // 초기에는 보이지 않음
          knifeDom.style.transform = "translate(-50%, -50%)"; // 중앙 정렬
          document.body.appendChild(knifeDom);

          // 애니메이션 변수
          let currentX = player.x;
          let currentY = player.y;
          function animate() {
              // 창 크기 얻기
              // const windowWidth = window.innerWidth;
              // const windowHeight = window.innerHeight;

              // // 원의 중심 (화면 중앙)
              // const centerX = windowWidth / 1.8;
              // const centerY = windowHeight / 2;

              // // 원의 반지름 (화면의 40% 크기)
              // const radius = Math.min(windowWidth, windowHeight) * 0.3;

              // // 플레이어의 x, y 좌표 계산
              // const dx = player.x - centerX;
              // const dy = player.y - centerY;
              // const distance = Math.sqrt(dx * dx + dy * dy); // 원의 중심과 플레이어의 거리

              // // 플레이어가 원을 벗어났다면, 원 위로 위치를 조정
              // if (distance > radius) {
              //     const angle = Math.atan2(dy, dx); // 플레이어가 원에서 차지하는 각도
              //     player.x = centerX + radius * Math.cos(angle); // 원 위의 x 위치 계산
              //     player.y = centerY + radius * Math.sin(angle); // 원 위의 y 위치 계산
              // }

              // 부드러운 이동 (보간)
              const speed = 0.1; // 이동 속도 (0 ~ 1 사이)
              currentX += (player.x - currentX) * speed;
              currentY += (player.y - currentY) * speed;

              // DOM 업데이트
              dom.style.left = `${currentX}px`;
              dom.style.top = `${currentY}px`;

              // 목표 위치에 거의 도달했는지 확인
              if (Math.abs(player.x - currentX) > 0.1 || Math.abs(player.y - currentY) > 0.1) {
                  requestAnimationFrame(animate); // 계속 애니메이션 실행
              }
          }

          // 창 크기 변경 시 동적으로 범위가 업데이트되도록 이벤트 리스너 추가
          window.addEventListener('resize', animate);


          // 플레이어 업데이트
          player.onChange(function (changes) {
            // 플레이어 위치 업데이트
            requestAnimationFrame(animate);

            // HP 바 업데이트
            const hpPercentage = Math.max(player.hp, 0) + "%";
            hpBar.style.width = hpPercentage; // 남은 HP 비율만큼 바 너비 변경
            

            // player별로 다른 화면을 띄우기 위해(한쪽의 hp 끝났을 떄)
            // const allPlayers = room.state.players;
            // let otherPlayerHp = null;

            // allPlayers.forEach((otherPlayer, otherSessionId)=> {
            //   if(otherSessionId !== sessionId) {
            //       otherPlayerHp = otherPlayer.hp;
            //   }
            // });

            // hp끝나면 화면 종료
            if (player.victoryNum === 1) {
              cancelAnimationFrame(animate);
  
              // 승리 화면 띄우기
              const victoryVideo = document.createElement("img");
              victoryVideo.src = "victory.gif"; 
              victoryVideo.style.position = "fixed";
              victoryVideo.style.top = "50%";
              victoryVideo.style.left = "50%";
              victoryVideo.style.transform = "translate(-50%, -50%)";
              victoryVideo.style.width = "80%";
              victoryVideo.style.zIndex = "1000";
              document.body.appendChild(victoryVideo);
            } 
            else if(player.victoryNum === 2){
              cancelAnimationFrame(animate);

              // 패배 화면 띄우기
              const defeatVideo = document.createElement("img");
              defeatVideo.src = "defeat1.gif";
              defeatVideo.style.position = "fixed";
              defeatVideo.style.top = "50%";
              defeatVideo.style.left = "50%";
              defeatVideo.style.transform = "translate(-50%, -50%)";
              defeatVideo.style.width = "80%";
              defeatVideo.style.zIndex = "1000";
              document.body.appendChild(defeatVideo);
            }
            {
              console.log("왜 안되냐고고");
            }

            // 플레이어 Knife 상태 업데이트
            if (player.knifeActive) {
              knifeDom.style.left = `${player.knifeX}px`;
              knifeDom.style.top = `${player.knifeY}px`;
              knifeDom.style.display = "block";
            } else {
              knifeDom.style.display = "none";
            }

          });

          players[sessionId] = dom;
          document.body.appendChild(dom);
        });

        // 플레이어 제거
        room.state.players.onRemove(function (player, sessionId) {
          if (players[sessionId]) {
            document.body.removeChild(players[sessionId]);
            delete players[sessionId];
          }
        });

        // 서버 메시지 핸들링 (필요 시)
        room.onMessage("hello", (message) => {
          console.log(message);
        });

        // 키보드 입력 감지 (칼 던지기)
        let canThrowKnife = true; // 쿨타임 상태를 추적하는 변수
        const knifeCooldown = 2000; // 쿨타임 시간 (밀리초)
        window.addEventListener("keydown", function (e) {
          if (e.key === 'q' && canThrowKnife) {
            room.send("throwKnife", { targetX: mouseX, targetY: mouseY });
            canThrowKnife = false; // 쿨타임 시작
            setTimeout(() => {
              canThrowKnife = true; // 쿨타임 종료
            }, knifeCooldown);
          }
        });

        // 마우스 위치 찾기
        window.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        // 우클릭 이벤트 처리 (이동 명령)
        window.addEventListener("contextmenu", function (e) {
          e.preventDefault(); // 기본 컨텍스트 메뉴 방지

          // 클릭한 위치의 좌표 계산
          const x = e.clientX;
          const y = e.clientY;

          // 서버로 목표 위치 전송
          room.send("moveTo", { x: x, y: y });
        });
      }

      // **방 참여 버튼 이벤트 리스너**
      document.getElementById("joinButton").addEventListener("click", function() {
        const roomId = document.getElementById("roomIdInput").value.trim();
        if (!roomId) {
          alert("방 ID를 입력하세요.");
          return;
        }
        joinRoomById(roomId);
      });

      // **방 생성 버튼 이벤트 리스너**
      document.getElementById("createButton").addEventListener("click", function() {
        createNewRoom();
      });
    </script>
  </body>
</html>
